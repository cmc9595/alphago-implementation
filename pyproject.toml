[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "alphago-implementation"
version = "0.1.0"
description = "AlphaGo (2016) SL/RL/value pipeline scaled down to a single Apple Silicon laptop"
requires-python = ">=3.11"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
mlx = ["mlx"]
dev = ["pytest"]

[tool.setuptools]
packages = ["alphago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
